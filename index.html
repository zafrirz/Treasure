<!doctype html>
<html lang="he" dir="rtl" class="auth-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b3a">
  <title>משחק חפש את המטמון</title>
  <meta name="description" content="עמודי משחק חפש את המטמון למשפחה ולחברים">
  <link rel="stylesheet" href="/Treasure/styles.css">
  <link rel="stylesheet" href="/Treasure/auth.css">
  <link rel="stylesheet" href="/Treasure/site-extra.css?v=20260912-4">
  <script src="/Treasure/auth.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="/Treasure/app.js?v=20260912-5" defer></script>
</head>
<body>
  <main class="site-shell">
    <header class="hero treasure-hero">
      <p class="eyebrow">TREASURE TRAIL</p>
      <h1>חפש את המטמון</h1>
      <p id="active-game" class="active-game">טוען את המשחק…</p>
      <div class="hero-actions">
        <a id="print-link" class="button primary" href="/Treasure/print.html?print=1&amp;layout=5" target="_blank" rel="noopener">הדפסת קודי QR</a>
        <button id="download-current" class="button secondary" type="button">הורדת קובץ ההגדרות הנוכחי</button>
      </div>
    </header>

    <details class="admin-panel">
      <summary>ניהול ועדכון המשחק</summary>
      <div class="admin-content">
        <p class="admin-intro">בחרו קובץ Excel במבנה המצורף. הקובץ נבדק לפני שמוצעת אפשרות החלה.</p>
        <div class="form-grid">
          <label class="field wide"><span>1. קובץ Excel</span><input id="excel-file" type="file" accept=".xlsx,.xls"></label>
          <label class="field"><span>2. גיליון רלוונטי</span><select id="sheet-select" disabled><option>יש לבחור קובץ</option></select></label>
          <label class="field"><span>3. שם המשחק</span><select id="game-select" disabled><option>יש לבחור גיליון תקין</option></select></label>
        </div>
        <div id="validation-message" class="notice neutral" role="status">ממתין לקובץ.</div>
        <div id="changes-summary" class="change-summary" hidden></div>
        <label class="field token-field">
          <span>אסימון גישה ל-GitHub</span>
          <input id="github-token" type="password" autocomplete="off" spellcheck="false" placeholder="Fine-grained token עם הרשאת Contents: Read and write">
          <small>האסימון נשמר במכשיר זה בלבד עד להתנתקות מעמוד האדמין.</small>
        </label>
        <button id="apply-workbook" class="button danger" type="button" disabled>החל את הקובץ על האתר</button>
        <div id="apply-status" class="apply-status" aria-live="polite"></div>
      </div>
    </details>

    <section class="targets-section" aria-labelledby="targets-title">
      <div class="section-heading section-heading-row">
        <div><p class="section-kicker">תחנות המשחק</p><h2 id="targets-title">יעדים וקודי QR</h2></div>
        <label class="field compact-field"><span>הצגת משחק</span><select id="display-game-select"><option value="">כל המשחקים</option></select></label>
      </div>
      <div id="target-grid" class="games-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
